<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safari Stay – Mombasa</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .tabsBar{
      display:flex; gap:10px; padding:10px 14px;
      max-width:1100px; margin:0 auto;
    }
    .tabLink{
      text-decoration:none; color:#eaf1ff;
      background:rgba(255,255,255,.08);
      padding:8px 12px; border-radius:999px;
      font-weight:800;
    }
    .tabLink.active{
      outline:2px solid rgba(255,211,110,.9);
      outline-offset:2px;
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🏝️</div>
    <div>
      <div class="title">Safari Stay</div>
      <div class="subtitle">Mombasa Hotel</div>
    </div>
  </div>

  <div class="hud">
    <div class="pill">🪙 Coins: <span id="coins">0</span></div>
    <div class="pill">👥 Queue: <span id="queue">0</span></div>
    <div class="pill">✅ Served: <span id="served">0</span></div>
  </div>
</header>

<!-- Tabs -->
<nav class="tabsBar">
  <a class="tabLink active" href="index.html">🏨 Hotel</a>
  <a class="tabLink" href="puzzle.html">🧩 Puzzle</a>
</nav>

<main class="wrap">
  <section class="scene">
    <img class="sceneImg" src="images/hotel_scene.png" alt="Mombasa hotel scene" />

    <!-- Doors -->
    <button class="hotspot door" data-spot="door2L" aria-label="Door 1"></button>
    <button class="hotspot door" data-spot="door2R" aria-label="Door 2"></button>
    <button class="hotspot station" data-spot="snack" aria-label="Snack station"></button>

    <button class="hotspot door" data-spot="door3L" aria-label="Door 3"></button>
    <button class="hotspot door" data-spot="door3R" aria-label="Door 4"></button>
    <button class="hotspot station" data-spot="clean" aria-label="Cleaning station"></button>

    <button class="hotspot ground" data-spot="reception" aria-label="Reception"></button>
    <button class="hotspot ground" data-spot="lounge" aria-label="Lounge"></button>
    <button class="hotspot ground" data-spot="ocean" aria-label="Ocean view"></button>

    <button class="hotspot stairs" data-spot="stairs" aria-label="Stairs"></button>
    <div class="bubble" id="bubble" hidden></div>
  </section>

  <section class="actions">
    <button id="btnSpawn">➕ Add Guest</button>
    <button id="btnDeliver">🛎️ Deliver Snack</button>
    <button id="btnClean">🧼 Clean Room</button>
    <button id="btnReset">♻️ Reset Hotel</button>


    <div class="hint" id="hint">Tap a door or station.</div>

    <label class="debugToggle">
      <input type="checkbox" id="debugHotspots" />
      Show hotspot boxes
    </label>
  </section>
</main>

<script src="Mombasa.js"></script>
</body>
</html>
