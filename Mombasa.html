<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safari Stay – Mombasa Hotel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🏝️</div>
    <div>
      <div class="title">Safari Stay</div>
      <div class="subtitle">Mombasa Hotel</div>
    </div>
  </div>

  <div class="hud">
    <div class="pill">🪙 Coins: <span id="coins">0</span></div>
    <div class="pill">👥 Queue: <span id="queue">0</span></div>
    <div class="pill">✅ Served: <span id="served">0</span></div>
  </div>
</header>

<main class="wrap">
  <section class="scene">
    <img class="sceneImg" src="images/hotel_scene.png" alt="Mombasa hotel scene" />

    <!-- Doors: Floor 1 (Snack floor) -->
    <button class="hotspot door closed" data-spot="door2L" aria-label="Door 1 (Snack floor left)">
      <span class="doorOverlay" aria-hidden="true"></span>
    </button>

    <button class="hotspot door closed" data-spot="door2R" aria-label="Door 2 (Snack floor right)">
      <span class="doorOverlay" aria-hidden="true"></span>
    </button>

    <!-- Snack station -->
    <button class="hotspot station" data-spot="snack" aria-label="Snack station"></button>

    <!-- Doors: Floor 2 (Cleaning floor) -->
    <button class="hotspot door closed" data-spot="door3L" aria-label="Door 3 (Cleaning floor left)">
      <span class="doorOverlay" aria-hidden="true"></span>
    </button>

    <button class="hotspot door closed" data-spot="door3R" aria-label="Door 4 (Cleaning floor right)">
      <span class="doorOverlay" aria-hidden="true"></span>
    </button>

    <!-- Cleaning station -->
    <button class="hotspot station" data-spot="clean" aria-label="Cleaning station"></button>

    <!-- Ground floor -->
    <button class="hotspot ground" data-spot="reception" aria-label="Reception"></button>
    <button class="hotspot ground" data-spot="lounge" aria-label="Lounge"></button>
    <button class="hotspot ground" data-spot="ocean" aria-label="Ocean glass"></button>

    <!-- Stairs -->
    <button class="hotspot stairs" data-spot="stairs" aria-label="Stairs"></button>

    <div class="bubble" id="bubble" hidden></div>
  </section>

  <section class="actions">
    <button id="btnSpawn">➕ Add Guest</button>
    <button id="btnDeliver">🛎️ Deliver Snack</button>
    <button id="btnClean">🧼 Clean Room</button>

    <div class="hint" id="hint">Tap a door or station.</div>

    <label class="debugToggle">
      <input type="checkbox" id="debugHotspots" />
      Show hotspot boxes
    </label>
  </section>
</main>

<script src="Mombasa.js"></script>
</body>
</html>
