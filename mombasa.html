<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safari Stay – Mombasa Hotel</title>
  <link rel="stylesheet" href="style.css" />
  <script src="hotel.js" defer></script>
</head>

<body>
<header class="topbar">
  <div class="brand">
    <a class="logoLink" href="index.html" title="Back">
      <div class="logo">🏝️</div>
    </a>
    <div>
      <div class="title">Safari Stay</div>
      <div class="subtitle">Mombasa Hotel</div>
    </div>
  </div>

  <div class="hud">
    <div class="pill">🪙 Coins: <span id="coins">0</span></div>
    <div class="pill">👥 Queue: <span id="queue">0</span></div>
    <div class="pill">✅ Served: <span id="served">0</span></div>
    <div class="pill" id="boostPill" style="display:none;">🎁 Boosts active</div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="rowBetween" style="gap:12px;flex-wrap:wrap;">
      <div class="muted" id="deliveryHint">Pick a snack then tap a room that ordered.</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn" id="btnSpawnGuest">➕ Spawn Guest</button>
        <a class="btn" href="puzzle.html">🧩 Go Puzzle</a>
        <button class="btn" id="btnClear">♻️ Reset Save</button>
      </div>
    </div>

    <div style="height:10px"></div>

    <div class="pill">Queue Visual: <span id="spawnPeople">✨</span></div>

    <div style="height:12px"></div>

    <div class="rowBetween" style="gap:12px; flex-wrap:wrap;">
      <div class="smallMuted">Snack Corner</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn snack" data-snack="🍟">🍟</button>
        <button class="btn snack" data-snack="🍹">🍹</button>
        <button class="btn snack" data-snack="🍉">🍉</button>
        <button class="btn snack" data-snack="🍔">🍔</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 style="margin:0 0 10px 0;">Rooms</h2>
    <div id="rooms" class="roomsGrid"></div>
  </section>
</main>
</body>
</html>
