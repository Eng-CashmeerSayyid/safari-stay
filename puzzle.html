<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safari Stay – Puzzle</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .tabsBar{
      display:flex; gap:10px; padding:10px 14px;
      max-width:1100px; margin:0 auto;
    }
    .tabLink{
      text-decoration:none; color:#eaf1ff;
      background:rgba(255,255,255,.08);
      padding:8px 12px; border-radius:999px;
      font-weight:800;
    }
    .tabLink.active{
      outline:2px solid rgba(255,211,110,.9);
      outline-offset:2px;
    }

    .pwrap{max-width:1100px;margin:0 auto;padding:14px;}
    .pcard{
      background: rgba(255,255,255,.04);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      padding: 14px;
      display:grid;
      gap:12px;
    }
    .board{
      display:grid;
      grid-template-columns: repeat(6, 1fr);
      gap:10px;
    }
    .tile{
      aspect-ratio: 1/1;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      display:grid;
      place-items:center;
      cursor:pointer;
      overflow:hidden;
      user-select:none;
    }
    .tile.selected{
      outline: 3px solid rgba(255,211,110,.95);
      outline-offset: 2px;
    }
    .tile img{
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events:none;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }
    .prow{
      display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    }
    .smallhint{color:#9fb3d6;font-size:13px;}
  </style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🧩</div>
    <div>
      <div class="title">Safari Stay</div>
      <div class="subtitle">Mombasa Puzzle</div>
    </div>
  </div>

  <div class="hud">
    <div class="pill">🪙 Coins: <span id="coins">0</span></div>
  </div>
</header>

<nav class="tabsBar">
  <a class="tabLink" href="index.html">🏨 Hotel</a>
  <a class="tabLink active" href="puzzle.html">🧩 Puzzle</a>
</nav>

<main class="pwrap">
  <section class="pcard">
    <div class="prow">
      <div class="smallhint">Tap two tiles to swap. Every swap gives <b>+1 coin</b>.</div>
      <button id="btnShuffle">🔄 Shuffle</button>
    </div>
    <div class="board" id="board"></div>
    <div class="smallhint" id="phint">Make matches later — for now swaps earn coins (so puzzle feeds the hotel).</div>
  </section>
</main>

<script>
  // Coins shared with hotel
  const getNum = (k, fb=0) => {
    const v = Number(localStorage.getItem(k));
    return Number.isFinite(v) ? v : fb;
  };
  const setNum = (k, v) => localStorage.setItem(k, String(v));

  let coins = getNum("coins", 0);
  const uiCoins = document.getElementById("coins");
  const boardEl = document.getElementById("board");
  const phint = document.getElementById("phint");

  function renderCoins(){ uiCoins.textContent = coins; }

  // 6 Mombasa tiles (put these files in images/tiles/)
  const tileImgs = [
    "images/tiles/palm.png",
    "images/tiles/shell.png",
    "images/tiles/fish.png",
    "images/tiles/coconut.png",
    "images/tiles/wave.png",
    "images/tiles/sun.png",
  ];

  const SIZE = 6;
  let grid = [];
  let selected = null;

  function randTile(){ return Math.floor(Math.random() * tileImgs.length); }

  function buildGrid(){
    grid = Array.from({length: SIZE*SIZE}, () => randTile());
  }

  function draw(){
    boardEl.innerHTML = "";
    grid.forEach((t, i) => {
      const b = document.createElement("button");
      b.className = "tile";
      b.dataset.i = String(i);

      const img = document.createElement("img");
      img.src = tileImgs[t];
      img.alt = "tile";
      b.appendChild(img);

      b.addEventListener("click", () => onPick(i, b));
      boardEl.appendChild(b);
    });
  }

  function clearSelectionUI(){
    document.querySelectorAll(".tile").forEach(x => x.classList.remove("selected"));
  }

  function swap(i, j){
    const tmp = grid[i];
    grid[i] = grid[j];
    grid[j] = tmp;
  }

  function onPick(i, btn){
    if (selected === null){
      selected = i;
      clearSelectionUI();
      btn.classList.add("selected");
      return;
    }

    if (selected === i){
      selected = null;
      clearSelectionUI();
      return;
    }

    // Swap
    swap(selected, i);
    selected = null;
    clearSelectionUI();
    draw();

    // +1 coin per move
    coins += 1;
    setNum("coins", coins);
    renderCoins();
    phint.textContent = "✅ Swap made! +1 coin saved for the hotel.";
  }

  document.getElementById("btnShuffle").addEventListener("click", () => {
    buildGrid();
    draw();
    phint.textContent = "🔄 Shuffled!";
  });

  // init
  buildGrid();
  draw();
  renderCoins();
</script>

</body>
</html>
