<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safari Stay – Puzzle</title>
  <link rel="stylesheet" href="style.css" />
  <script src="puzzle.js" defer></script>
</head>

<body>
<header class="topbar">
  <div class="brand">
    <a class="logoLink" href="index.html" title="Back">
      <div class="logo">🧩</div>
    </a>
    <div>
      <div class="title">Safari Stay</div>
      <div class="subtitle">Puzzle → Hotel Rewards</div>
    </div>
  </div>

  <div class="hud">
    <div class="pill">🪙 Coins: <span id="coins">0</span></div>
    <div class="pill">Target: <span id="target">300</span></div>
    <button class="btn" id="resetPuzzle">♻️ Reset Puzzle</button>
    <a class="btn primary" href="mombasa.html">🏨 Back Hotel</a>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="muted">
      Match <b>3+</b> tiles to earn coins.
      Big clears unlock boosts:
      <b>4 = Snack Boost</b>, <b>5 = Cleaner Boost</b>, <b>6 = Patience Boost</b>.
    </div>

    <div style="height:12px"></div>
    <div id="board" class="board"></div>

    <div style="height:10px"></div>
    <div id="msg" class="msg"></div>
  </section>
</main>
</body>
</html>
