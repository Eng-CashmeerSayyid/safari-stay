<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Safari Stay – Puzzle</title>

  <link rel="stylesheet" href="style.css" />
  <script src="puzzle.js" defer></script>

  <style>
    .pwrap{max-width:1100px;margin:0 auto;padding:14px;}
    .pcard{
      background: rgba(255,255,255,.04);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      padding: 14px;
      display:grid;
      gap:12px;
    }
    #msg{ font-size:13px; opacity:.92; min-height:1.2em; }
  </style>
</head>

<body>
<header class="topbar">
  <div class="brand">
    <a class="logoLink" href="index.html" title="Back">
      <div class="logo">🧩</div>
    </a>
    <div>
      <div class="title">Safari Stay</div>
      <div class="subtitle">Mombasa Puzzle</div>
    </div>
  </div>

  <div class="hud">
    <div class="pill">🪙 Coins: <span id="coins">0</span></div>
    <div class="pill">Target: <span id="target">300</span></div>
    <button class="btn" id="resetPuzzle">♻️ Reset</button>
    <a class="btn" href="mombasa.html">🏨 Back Hotel</a>
  </div>
</header>

<main class="pwrap">
  <section class="pcard">
    <div class="muted">
      Match <b>3+</b> tiles to earn coins. Big matches unlock boosts:
      <b>4=Snack</b>, <b>5=Cleaner</b>, <b>6=Patience</b>.
    </div>

    <div id="board" class="board"></div>

    <div id="msg"></div>
  </section>
</main>
</body>
</html>
